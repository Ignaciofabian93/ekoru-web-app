allowBuilds:
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Security floor for a transitive dependency Next pulls in through styled-jsx
# and Babel (GHSA advisories fixed in 4.28.7). Drop once Next ships it.
overrides:
  browserslist: ~4.28.9
  # Through axios. 1.16.0 leaks credential headers on redirects (GHSA-q3jh-wrc6-jgq8,
  # GHSA-8r9p-f939-6h3c). Exact pin: 1.16.2 is too new. Drop once axios requires 1.16.1 or newer.
  follow-redirects: 1.16.1
